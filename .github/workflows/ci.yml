name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,audio]"

    - name: Run pytest
      run: |
        pytest tests/ -v --tb=short --cov=XEdu --cov-report=term-missing

    - name: Verify handler modules import
      run: |
        python -c "from XEdu.hub.handlers.base import BaseHandler, ONNXHandler, DetectionHandler"
        python -c "from XEdu.hub.handlers.detection import DetBodyHandler, DetCocoHandler, DetFaceHandler, PalmHandDetectorHandler"
        python -c "from XEdu.hub.model_discovery import support_tasks, describe_task"

    - name: Verify wheel contains all subpackages
      run: |
        python -m build --wheel
        python - <<'PY'
        import zipfile, glob, sys
        wheel = glob.glob("dist/*.whl")[0]
        required = [
            "XEdu/LLM/__init__.py",
            "XEdu/LLM/client.py",
            "XEdu/utils/__init__.py",
            "XEdu/hub/models/__init__.py",
            "XEdu/hub/BaseDT/__init__.py",
            "XEdu/hub/handlers/__init__.py",
            "XEdu/hub/model_registry.py",
            "XEdu/hub/model_store.py",
            "XEdu/hub/exceptions.py",
            "XEdu/examples/getting_started.ipynb",
            "XEdu/examples/assets/xedu-vision-scene.png",
            "XEdu/examples/assets/xedu-road-scene.png",
            "XEdu/examples/assets/xedu-ocr-poster.png",
        ]
        names = zipfile.ZipFile(wheel).namelist()
        missing = [r for r in required if r not in names]
        if missing:
            print("Missing from wheel:", missing)
            sys.exit(1)
        print("All required subpackages present in wheel.")
        PY
        ls -lh dist/
